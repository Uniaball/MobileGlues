name: Build DesktopGlues for Android

on:
  push:
  workflow_dispatch:
  
env:
  USE_FULL_LTO: ON
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Clone Dependencies
      run: |
        cd MobileGlues-cpp
        git clone --depth 1 https://github.com/g-truc/glm.git 3rdparty/glm
        git clone --depth 1 https://github.com/stbrumme/xxhash.git 3rdparty/xxhash
        git clone --depth 1 https://android.googlesource.com/platform/external/perfetto 3rdparty/perfetto
        git clone --depth 1 https://github.com/MobileGL-Dev/FastSTL.git include/FastSTL
        git clone --depth 1 https://github.com/KhronosGroup/glslang.git 3rdparty/glslang
        git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git 3rdparty/SPIRV-Cross
        
    - name: Configure CMake
      run: |
        cd MobileGlues-cpp
        if [ "$USE_FULL_LTO" = "ON" ]; then
          cmake -B build \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_TOOLCHAIN=clang \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS="-w -g -std=gnu99 -funwind-tables -fvisibility=hidden -flto" \
          -DCMAKE_CXX_FLAGS="-w -fvisibility=hidden -funwind-tables -g -D_THREAD_SAFE -fPIC -flto" \
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -flto"
          
        else
          cmake -B build \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-29 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_TOOLCHAIN=clang \
          -DCMAKE_BUILD_TYPE=Release 
        fi
        
    - name: Build
      run: cmake --build MobileGlues-cpp/build --config Release --target desktopglues --parallel $(nproc)

    - name: Strip
      run: |
        cd MobileGlues-cpp/build/
        $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip libdesktopglues.so
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: DesktopGlues
        path: MobileGlues-cpp/build/libdesktopglues.so