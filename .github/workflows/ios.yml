name: Build DesktopGlues for iOS
on: 
   workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest
        run: git submodule update --remote --recursive

      - name: Build DesktopGlues
        run: |
          cd MobileGlues-cpp/ 
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake \
            -DSTATICLIB=OFF \
            -DMACOS=ON \
            -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target desktopglues
          codesign -s - build/libdesktopglues.dylib

      - name: Upload lib
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGlues-iOS-dylib
          path: MobileGlues-cpp/build/libdesktopglues.dylib